<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .booking-container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #574bdb;
        }
    </style>
</head>

<body>

<div class="booking-container">

    <h2>Book Your Ride</h2>

    <form th:action="@{/user/bookRide}" method="post">

        <!-- Ride Name -->
        <input type="text"
               name="ride_name"
               th:value="${booking.ride_name}"
               readonly>

        <!-- Customer Name -->
        <input type="text"
               name="customer_name"
               placeholder=" Enter Customer Name"
               th:value="${booking != null ? booking.customer_name : ''}"
               required>

        <!-- Phone -->
        <input type="text"
               name="customer_phone"
               placeholder="Phone Number"
               th:value="${booking != null ? booking.customer_phone : ''}"
               required>

        <!-- Date -->
        <label>Select Date</label>

        <input type="date"
               name="booking_date"
               th:value="${booking != null ? booking.booking_date : ''}"
               required>

        <!-- Time -->
        <label>Select Time Slot</label>

        <select name="booking_time" required>

            <option value="">-- Choose Time Slot --</option>

            <option value="10:00"
                    th:selected="${booking != null
                    && booking.booking_time != null
                    && booking.booking_time.toString() == '10:00'}">
                10:00 AM
            </option>

            <option value="12:00"
                    th:selected="${booking != null
                    && booking.booking_time != null
                    && booking.booking_time.toString() == '12:00'}">
                12:00 PM
            </option>

            <option value="14:00"
                    th:selected="${booking != null
                    && booking.booking_time != null
                    && booking.booking_time.toString() == '14:00'}">
                02:00 PM
            </option>

            <option value="16:00"
                    th:selected="${booking != null
                    && booking.booking_time != null
                    && booking.booking_time.toString() == '16:00'}">
                04:00 PM
            </option>

            <option value="18:00"
                    th:selected="${booking != null
                    && booking.booking_time != null
                    && booking.booking_time.toString() == '18:00'}">
                06:00 PM
            </option>

        </select>

        <!-- Hidden Price -->
        <input type="hidden"
               id="price"
               name="total_amount"
               th:value="${booking.total_amount}">


        <!-- Tickets -->
        <input type="number"
               id="tickets"
               name="total_tickets"
               placeholder="No. of Tickets"
               min="1"
               th:value="${booking != null
               ? booking.total_tickets
               : ''}"
               required>

        <!-- Total -->
        <p>
            Total Amount:
            ₹ <span id="total">0</span>
        </p>

        <button type="submit">
            Proceed
        </button>

    </form>

</div>

<script>

    let ticketsInput = document.getElementById("tickets");
    let priceInput = document.getElementById("price");
    let total = document.getElementById("total");

    function calculateTotal() {

        let tickets = parseInt(ticketsInput.value);
        let price = parseInt(priceInput.value);

        if (tickets > 0 && price > 0) {
            total.innerText = tickets * price;
        }
        else {
            total.innerText = 0;
        }
    }

    ticketsInput.addEventListener("input", calculateTotal);

    window.onload = calculateTotal;

</script>

</body>
</html>
