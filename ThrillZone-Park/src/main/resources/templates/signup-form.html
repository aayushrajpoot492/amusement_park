<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - ThrillZone</title>
    <link rel="stylesheet" href="/css/signup-form.css">
</head>
<body>
<div class="container">

    <div class="image-box">
        <img src="images/Logo/signUp.webp">
    </div>
<div class="card">
    <h2>Sign Up</h2>
    <p id="subtitle">Enter your email to receive OTP</p>

    <form onsubmit="event.preventDefault(); sendOtp();">
        <input type="email" id="email" placeholder="Enter your email" required />
        <button type="submit" class="btn">Send OTP</button>
    </form>
</div>

<div id="customModal" class="modal-overlay" style="display: none !important;">
    <div class="modal-content">
        <div class="modal-icon">⚠️</div>
        <h3>Account Exists</h3>
        <p>This email is already registered. Please use another email to Sign Up.</p>
        <div class="modal-buttons">
            <button onclick="closeModal()" class="btn-primary">OK</button>
        </div>
    </div>
</div>
</div>
<script src="/js/signup-form-auth.js"></script>
</body>
</html>
