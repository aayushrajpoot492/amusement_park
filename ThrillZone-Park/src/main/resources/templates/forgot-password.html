<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/css/forgot-password.css">
</head>
<body>
<div class="parent-container">

    <div class="image-section">
        <img src="/images/Auth/forgot-password.jpg" alt="Forgot Password Image">
    </div>

    <div class="form-section">
        <form id="forgotPassForm">
            <h2>Reset Password</h2>
            <p>Please enter your new password below.</p>

            <div class="input-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPass" name="newPass" class="pass-inp" required>
                    <span class="toggle-password" onclick="togglePass('newPass', this)">👁️</span>
                </div>
                <span id="passError" class="error-msg"></span>
            </div>

            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPass" name="confirmPass" class="cpass-inp" required>
                <span id="confirmError" class="error-msg"></span>
            </div>

            <input type="submit" id="submitBtn" value="Update Password" class="submit-btn" disabled>
        </form>
    </div>
</div>

<script src="/js/forgot-password.js"></script>
</body>
</html>
