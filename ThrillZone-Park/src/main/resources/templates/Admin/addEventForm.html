<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Event - ThrillZone</title>
    <link rel="stylesheet" th:href="@{/admincss/eventsForm.css}">

</head>
<body>

<form th:action="@{/admin/addEvent}" method="post" enctype="multipart/form-data">
    <h1>Add New Event</h1>

    <div class="input-group">
        <label>Event Name</label>
        <input type="text" name="e_name" placeholder="Enter event name" required>
    </div>

    <div class="input-group">
        <label>Description</label>
        <input type="text" name="e_desc" placeholder="Enter description" required>
    </div>

    <div class="input-group">
        <label>Age Limit</label>
        <input type="number" name="age_limit" placeholder="Minimum age">
    </div>

    <div class="input-group">
        <label>Ticket Price</label>
        <input type="number" step="0.01" name="e_price" placeholder="0.00" required>
    </div>

    <div class="input-group">
        <label>Event Date</label>
        <input type="date" name="e_date" required>
    </div>

    <div class="input-group">
        <label>Event Time</label>
        <input type="time" name="e_time" required>
    </div>

    <div class="input-group checkbox-group">
        <input type="checkbox" name="is_available" id="is_available" checked>
        <label for="is_available">Available for Booking</label>
    </div>

    <div class="input-group">
        <label>Event Banner/Image</label>
        <input type="file" name="imageFile" accept="image/*" required>
    </div>

    <button type="submit">Save Event</button>
</form>

</body>
</html>
