<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Summary</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        p {
            font-size: 18px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #574bdb;
        }
    </style>
</head>
<body>

<div class="card">

    <h2>Booking Summary</h2>
    <p><b>Ride Name:</b>
        <span th:text="${booking.ride_name}"></span>
    </p>

    <p><b>Customer Name:</b>
        <span th:text="${booking.customer_name}"></span>
    </p>

    <p><b>Date:</b>
        <span th:text="${booking.booking_date}"></span>
    </p>

    <p><b>Time Slot:</b>
        <span th:text="${booking.booking_time}"></span>
    </p>

    <p><b>Total Tickets:</b>
        <span th:text="${booking.total_tickets}"></span>
    </p>

    <p><b>Total Amount:</b>
        ₹ <span th:text="${finalTotal}"></span>
    </p>

    <form th:action="@{/user/paymentPage}" method="post">

        <input type="hidden"
               name="ride_name"
               th:value="${booking.ride_name}">

        <input type="hidden"
               name="customer_name"
               th:value="${booking.customer_name}">

        <input type="hidden"
               name="customer_phone"
               th:value="${booking.customer_phone}">

        <input type="hidden"
               name="booking_date"
               th:value="${booking.booking_date}">

        <input type="hidden"
               name="booking_time"
               th:value="${booking.booking_time}">

        <input type="hidden"
               name="total_tickets"
               th:value="${booking.total_tickets}">

        <input type="hidden"
               name="total_amount"
               th:value="${finalTotal}">

        <button type="submit">
            Proceed To Payment
        </button>

    </form>

    <form th:action="@{/user/editBooking}" method="post">

        <input type="hidden"
               name="ride_name"
               th:value="${booking.ride_name}">

        <input type="hidden"
               name="customer_name"
               th:value="${booking.customer_name}">

        <input type="hidden"
               name="customer_phone"
               th:value="${booking.customer_phone}">

        <input type="hidden"
               name="booking_date"
               th:value="${booking.booking_date}">

        <input type="hidden"
               name="booking_time"
               th:value="${booking.booking_time}">

        <input type="hidden"
               name="total_tickets"
               th:value="${booking.total_tickets}">

        <input type="hidden"
               name="total_amount"
               th:value="${booking.total_amount}">

        <button type="submit"
                class="btn edit-btn">

            Edit Details

        </button>

    </form>


</div>

</body>
</html>
