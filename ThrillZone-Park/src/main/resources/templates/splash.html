<!DOCTYPE html>
<html lang="hi" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Card Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #00f2ff;
    background: linear-gradient(45deg, rgba(0, 242, 255, 1) 37%, rgba(0, 255, 106, 1) 50%, rgba(232, 151, 213, 1) 88%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    padding: 20px;
}

.card {
    flex: 0 1 auto;
    text-align: center;
    cursor: pointer;
}
.card-box {
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
}


.image-box {
    width: 200px;
    height: 280px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #FFD700;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
}
h3{
   color: #ffffff;
   text-shadow: 0px 2px 4px rgba(0,0,0,0.3);
   font-weight: bold;
}
p{
  color: rgba(255, 255, 255,0.8);
}

.content h3 {
    color: white;
    margin-top: 15px;
    font-size: 22px;
}

.content p {
    color: #4a4a4a;
    font-size: 14px;
    font-weight: 400;
    margin-bottom: 20px;
}

.container::-webkit-scrollbar {
    display: none;
}
.drawer {
    position: fixed;
    top: 0;
    right: -100%;
    width: 300px;
    height: 100%;
    background-color: white;
    box-shadow: -5px 0 15px rgba(0,0,0,0.2);
    transition: 0.3s;
    z-index: 1000;
    padding: 20px;
}
.drawer.open {
    right: 0;
}

.close-btn {
    font-size: 30px;
    cursor: pointer;
    float: right;
}
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 999;
}
.overlay.show {
    display: block;
}
    #drawerList {
    list-style: none;
    padding: 0;
    margin-top: 50px;
}

#drawerList li {
    padding: 15px;
    border-bottom: 1px solid #eee;
    font-size: 18px;
    color: #444;
}

</style>

<div class="container">
    <form th:action="@{/splash}" method="post" class="card-container">
    <div class="card" onclick="openDrawer('Carnival Festive', ['Timing', 'Saturday to Sunday', 'After 8pm'])">
        <div class="image-box">
            <span class="badge">NEW</span>
            <img src="always-fun-see-tall-ferris-wheel-when-approaching-park-holidays-full-happy-people.jpg" alt="Swinggers">
        </div>
        <div class="content">
            <h3>Swinggers</h3>
            <p>Park</p>
        </div>
    </div>

    <div class="card" onclick="openDrawer('Carnival Festive', ['Timing', 'Saturday to Sunday', 'After 8pm'])">
        <div class="image-box">
            <img src="beautiful-miami-bayside-marketplace-scene (1).jpg" alt="Carnival">
        </div>
        <div class="content">
            <h3>Carnival</h3>
            <p>Festive</p>
        </div>
    </div>
            <div class="card" onclick="openDrawer('Hurricane Rides', ['Desert Safari - ₹1000', 'Surfing - ₹1500', 'Camel Ride - ₹500'])">
                <div class="image-box">
                    <img src="Gemini_Generated_Image_6hbiu96hbiu96hbi.png" alt="Hurricane">
                </div>
                <div class="content">
                    <h3>Hurricane Rides</h3>
                    <p>Desert+Sea</p>
                </div>
            </div>

            <div class="card" onclick="openDrawer('Food Hub', ['Burger - ₹49', 'Pizza - ₹149', 'Cold Drink - ₹25'])">
                <div class="image-box">
                    <img src="Gemini_Generated_Image_8b8lgx8b8lgx8b8l.png" alt="FoodHub">
                </div>
                <div class="content">
                    <h3>Food</h3>
                    <p>Hub</p>
                </div>
            </div>

        <div id="sideDrawer" class="drawer">
            <div class="drawer-content">
                <span class="close-btn" onclick="event.stopPropagation(); closeDrawer()">&times;</span>
                <h2 id="drawerTitle">Details</h2>
                <p style="color: gray; margin-top: 10px;">Menu/Info:</p>
                <ul id="drawerList">
                </ul>
            </div>
        </div>

        <div id="overlay" class="overlay" onclick="closeDrawer()"></div>

        <div class="card">
        <div class="image-box">
            <img src="Gemini_Generated_Image_8b8lgx8b8lgx8b8l.png" alt="Bhubaneswar">
        </div>
        <div class="content">
            <h3>Bhubaneswar</h3>
            <p>Park</p>
        </div>
    </div>
    </form>
</div>
<script>
    function openDrawer(title, itemsArray) {
     document.getElementById("drawerTitle").innerText = title;
     const listContainer = document.getElementById("drawerList");
     listContainer.innerHTML = "";

     if (itemsArray && itemsArray.length > 0) {
         itemsArray.forEach(item => {
             let li = document.createElement("li");
             li.innerText = item;
             listContainer.appendChild(li);
         });
     }
     document.getElementById("sideDrawer").classList.add("open");
     document.getElementById("overlay").classList.add("show");
 }

 function closeDrawer() {
     document.getElementById("sideDrawer").classList.remove("open");
     document.getElementById("overlay").classList.remove("show");
 }
</script>
</body>
</html>
