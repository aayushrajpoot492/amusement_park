<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email OTP Sign In UI</title>
    <style>
        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        }
        body {
          min-height: 100vh;
          background: linear-gradient(45deg, purple, orange);
          display: flex;
          justify-content: center;
          align-items: center;
        }
        .card {
          width: 380px;
          background: white;
          padding: 30px;
          border-radius: 20px;
          box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; margin-bottom: 10px; }
        p { text-align: center; color: gray; margin-bottom: 20px; }
        input[type="email"] {
          width: 100%;
          padding: 12px;
          border: 1px solid #ccc;
          border-radius: 10px;
          margin-bottom: 15px;
          font-size: 16px;
        }
        .btn {
          width: 100%;
          padding: 12px;
          border: none;
          background: #FF7F50;
          color: white;
          border-radius: 10px;
          cursor: pointer;
          font-size: 16px;
        }
        .otp-boxes {
          display: flex;
          gap: 10px;
          justify-content: center;
          margin-bottom: 20px;
        }
        .otp-boxes input {
          width: 50px;
          height: 50px;
          text-align: center;
          font-size: 22px;
          border: 1px solid #ccc;
          border-radius: 10px;
        }
        .hidden { display: none; }
        .link-btn {
          background: none;
          border: none;
          color: gray;
          margin-top: 10px;
          cursor: pointer;
          width: 100%;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Sign In</h2>
    <p id="subtitle">Enter your email to receive OTP</p>

    <div id="emailStep">
        <input type="email" id="email" placeholder="Enter your email" />
        <button class="btn" onclick="sendOtp()">Send OTP</button>
    </div>

    <div id="otpStep" class="hidden">
        <div class="otp-boxes">
            <input maxlength="1" />
            <input maxlength="1" />
            <input maxlength="1" />
            <input maxlength="1" />
        </div>
        <button class="btn" onclick="signIn()">Sign In</button>
        <button class="link-btn" onclick="changeEmail()">Change Email</button>
    </div>
</div>

<script>
    function sendOtp() {
      const email = document.getElementById('email').value;
      if (!email) {
        alert('Please enter email');
        return;
      }
      document.getElementById('emailStep').classList.add('hidden');
      document.getElementById('otpStep').classList.remove('hidden');
      document.getElementById('subtitle').innerText = 'Enter the 4-digit OTP';
    }

    function changeEmail() {
      document.getElementById('otpStep').classList.add('hidden');
      document.getElementById('emailStep').classList.remove('hidden');
      document.getElementById('subtitle').innerText = 'Enter your email to receive OTP';
    }

    function signIn() {
      const otpInputs = document.querySelectorAll('.otp-boxes input');
      let otp = '';
      otpInputs.forEach(input => otp += input.value);

      if (otp.length !== 4) {
        alert('Please enter valid OTP');
        return;
      }

      alert('Sign In Successful');
    }
</script>
</body>
</html>
