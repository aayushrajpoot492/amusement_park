<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #e1bee7);
      margin: 0;
      padding: 0;
  }

  form {
      width: 450px;
      margin: 50px auto;
      padding: 25px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  }
  form h1{
   text-align: center;

   }
  form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
  }

  form input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: 0.3s;
  }

  form input:focus {
      border-color: #7b1fa2;
      box-shadow: 0 0 5px rgba(123, 31, 162, 0.3);
  }

  form input[type="file"] {
      border: none;
  }

  form button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: linear-gradient(45deg, #ff5722, #ff9800);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
  }

  form button:hover {
      background: linear-gradient(45deg, #e64a19, #f57c00);
      transform: scale(1.03);
  }
  </style></head>
<body>
<form th:action="@{/user/addEvent}" method="post" enctype="multipart/form-data">

  <h1>Add Events</h1>

  <input type="text" name="e_name" placeholder="Event Name" required>

  <input type="text" name="e_desc" placeholder="Description" required>

  <input type="number" name="e_price" placeholder="Price">

  <label>Select Date</label>
  <input type="date" name="e_date" required>

  <label>Select Time Slot</label>
  <select name="e_time" required>
    <option value="">-- Choose Time Slot --</option>

    <option value="10:00">10:00 AM</option>
    <option value="12:00">12:00 PM</option>
    <option value="14:00">02:00 PM</option>
    <option value="16:00">04:00 PM</option>
    <option value="18:00">06:00 PM</option>
  </select>

  <input type="file" name="e_image" required>

  <label>
    <input type="checkbox" name="is_available" >Available
  </label>
  <button type="submit">Add Event</button>

</form>
</body>
</html>
