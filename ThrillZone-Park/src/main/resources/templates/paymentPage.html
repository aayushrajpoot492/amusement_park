<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Payment Page</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#74ebd5,#9face6);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .payment-container{

            background:white;
            width:400px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);

        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            margin:12px 0;
        }

        .payment-option{

            margin-top:20px;

        }

        label{
            font-size:17px;
        }

        button{

            width:100%;
            padding:12px;
            margin-top:25px;
            border:none;
            border-radius:8px;
            background:#6c63ff;
            color:white;
            font-size:16px;
            cursor:pointer;

        }

        button:hover{

            background:#574bdb;

        }

    </style>

</head>

<body>

<div class="payment-container">

    <h2>Payment Page 💳</h2>

    <p>
        <b> Ride Name:</b>
        <span th:text="${booking.ride_name}"></span>
    </p>
    <p>
        <b> Customer Name:</b>
        <span th:text="${booking.customer_name}"></span>
    </p>
    <p>
        <b> customer phone:</b>
        <span th:text="${booking.customer_phone}"></span>
    </p>

    <p>
        <b>Booking Date:</b>
        <span th:text="${booking.booking_date}"></span>
    </p>

    <p>
        <b>Time Slot:</b>
        <span th:text="${booking.booking_time}"></span>
    </p>

    <p>
        <b>Total Tickets:</b>
        <span th:text="${booking.total_tickets}"></span>
    </p>

    <p>
        <b>Total Amount:</b>
        ₹ <span th:text="${booking.total_amount * booking.total_tickets}"></span>
    </p>

    <form th:action="@{/user/confirmBooking}"
          method="post">

        <!-- Hidden Inputs -->

        <input type="hidden"
               name="ride_name"
               th:value="${booking.ride_name}">

        <input type="hidden"
               name="customer_name"
               th:value="${booking.customer_name}">

        <input type="hidden"
               name="customer_phone"
               th:value="${booking.customer_phone}">

        <input type="hidden"
               name="booking_date"
               th:value="${booking.booking_date}">

        <input type="hidden"
               name="booking_time"
               th:value="${booking.booking_time}">

        <input type="hidden"
               name="total_tickets"
               th:value="${booking.total_tickets}">

        <input type="hidden"
               name="total_amount"
               th:value="${booking.total_amount}">

        <!-- Payment Options -->

        <div class="payment-option">

            <h3>Select Payment Method</h3>

            <input type="radio"
                   name="payment_method"
                   value="UPI"
                   required>

            <label>UPI</label>

            <br><br>

            <input type="radio"
                   name="payment_method"
                   value="Cash Counter">

            <label>Cash Counter</label>

        </div>

        <button type="submit">

            Pay Now

        </button>

    </form>

</div>

</body>
</html>
