<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Success</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-box {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: green;
        }
    </style>
</head>
<body>

<div class="success-box">

    <h1>Booking Successful 🎉</h1>

    <h2>
        Booking ID:
        <span th:text="${bookingId}"></span>
    </h2>
    <p>
        Payment Method:
        <span th:text="${paymentMethod}"></span>
    </p>

    <p>
        Payment Status:
        <span th:text="${paymentStatus}"></span>
    </p>
    <br>

    <a th:href="@{/user/rides}">
        <button>
            Book Another Ride
        </button>
    </a>

    <br><br>

    <a th:href="@{/user/home}">
        <button>
            Go To Home
        </button>
    </a>

</div>

</body>
</html>
