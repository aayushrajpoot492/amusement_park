<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymleaf.org">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>LOGIN PAGE</title>
    <style>
        * {
     margin: 0;
     padding: 0;
     box-sizing: border-box;
     font-family: 'Poppins', sans-serif;
 }
        body {
     height: 100vh;
     margin: 0;
     padding: 0;
     background-image: url("6830067_38976.svg");
     background-size: cover;
     background-position: center;
     background-repeat: no-repeat;
     background-attachment: fixed;
     display: flex;
     align-items: center;
     justify-content: flex-start;
     padding-left: 80px;
 }
        .login-container {
        background: #fff;
        padding: 30px;
        width: 350px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        backdrop-filter: blur(8px);
        background: rgba(255, 255, 255, 0.9);
        }
        .login-container h2 {
        text-align: center;
        margin-bottom: 20px;
        letter-spacing: 1.5px;
        font-weight: 600;
        color: #333;
        }
        .input-group {
           margin-bottom: 15px;
        }

        .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        }

        .input-group input {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        outline: none;
        }

        .input-group input:focus {
        border-color: #667eea;
        }

        .forgot-links-container {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 5px;
    margin-bottom: 15px;
  }

.forgot-link {
    font-size: 12px;
    color: #4a90e2;
    text-decoration: none;
    font-family: 'Quicksand', sans-serif;
}

.forgot-link:hover {
    text-decoration: underline;
}
.signup-text-top {
    text-align: center;
    font-size: 7px;
    margin-bottom: 12px;
    color: #666;
    font-weight: 300;
}

.signup-text-top a {
    color: #4a90e2;
    text-decoration: none;
    font-weight: 200;
    margin-left: 3px;
}

.signup-text-top a:hover {
    text-decoration: underline;
}
.login-btn {
    width: 100%;
    padding: 12px;
    background-color: #e9458d;
    color: white;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}
.google-btn {
display: flex;
align-items: center;
justify-content: center;
width: 100%;
padding: 10px;
background-color: white;
border: 1px solid #ddd;
border-radius: 5px;
cursor: pointer;
margin: 15px 0;
transition: background 0.3s;
}

.google-btn img {
width: 20px;
margin-right: 10px;
}

.google-btn span {
font-weight: 500;
color: #555;
}

.google-btn:hover {
background-color: #f1f1f1;
}
        .separator {
text-align: center;
margin: 15px 0;
font-size: 12px;
color: #888;
position: relative;
}
    </style>
</head>
<body>
<div class="login-container">
    <h2> LOGIN </h2>
    <form th:action="@{/login}" method="post">
        <div class="input-group">
            <label>Email:</label>
            <input type="text" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <label>Password:</label>
            <input type="number" name="otp" placeholder="Enter Password" required>
            <div class="forgot-links-container">
                <a href="#" class="forgot-link">Forgot Email?</a>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
        </div>
        <p class="signup-text">
            Don't Have An Account?
            <a href="dashboard" style="text-decoration:none ; color: #4b7bec; font-weight: bold;">Sign Up</a>
        </p>
        <button class="login-btn">Login</button>

        <div class="separator">OR</div>

        <button class="google-btn">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google Logo">
            <span>Sign in with Google</span>
        </button>
    </form>
</div>
</body>
</html>
