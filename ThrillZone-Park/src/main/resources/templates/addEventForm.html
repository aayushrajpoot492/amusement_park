<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Event - ThrillZone</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #e1bee7);
            margin: 0;
            padding: 0;
        }

        form {
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        form h1 {
            text-align: center;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }

        form input, form select, form textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }

        form input:focus {
            border-color: #7b1fa2;
            box-shadow: 0 0 5px rgba(123, 31, 162, 0.3);
        }

        form button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(45deg, #ff5722, #ff9800);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        form button:hover {
            background: linear-gradient(45deg, #e64a19, #f57c00);
            transform: scale(1.02);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
        }
    </style>
</head>
<body>

<form th:action="@{/addEvent}" method="post" enctype="multipart/form-data">
    <h1>Add New Event</h1>

    <div class="input-group">
        <label>Event Name</label>
        <input type="text" name="e_name" placeholder="Enter event name" required>
    </div>

    <div class="input-group">
        <label>Description</label>
        <input type="text" name="e_desc" placeholder="Enter description" required>
    </div>

    <div class="input-group">
        <label>Age Limit</label>
        <input type="number" name="age_limit" placeholder="Minimum age">
    </div>

    <div class="input-group">
        <label>Ticket Price</label>
        <input type="number" step="0.01" name="e_price" placeholder="0.00" required>
    </div>

    <div class="input-group">
        <label>Event Date</label>
        <input type="date" name="e_date" required>
    </div>

    <div class="input-group">
        <label>Event Time</label>
        <input type="time" name="e_time" required>
    </div>

    <div class="input-group checkbox-group">
        <input type="checkbox" name="is_available" id="is_available" checked>
        <label for="is_available">Available for Booking</label>
    </div>

    <div class="input-group">
        <label>Event Banner/Image</label>
        <input type="file" name="imageFile" accept="image/*" required>
    </div>

    <button type="submit">Save Event</button>
</form>

</body>
</html>
